<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thaara AI 2.1</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1rem; background: #101827; color: #eef2ff; }
    .card { padding: 2rem; border-radius: 1rem; background: #1b2942; box-shadow: 0 1rem 3rem #0004; }
    button { padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #65d3ff; cursor: pointer; }
    #output { white-space: pre-wrap; min-height: 4rem; margin-top: 1rem; color: #c8d7f5; }
    .core { display: grid; place-items: center; margin-bottom: 1rem; }
    .core img { width: 190px; border-radius: 50%; box-shadow: 0 0 28px #e51f3d88; transition: transform .25s, filter .25s; }
    .core.face img { transform: scale(1.05); filter: saturate(1.4); }
    .core.open img { transform: scale(1.14) rotate(-3deg); filter: hue-rotate(12deg) saturate(1.7); }
    .core.fist img { transform: scale(.96) rotate(3deg); filter: brightness(1.35); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thaara AI 2.1</h1>
    <div id="core" class="core"><img src="assets/thaara_core.gif" alt="Thaara robotic AI core"></div>
    <p id="status">Ready in offline-safe mode.</p>
    <button id="hello">Say hello</button>
    <select id="voiceMode" aria-label="Voice mode"><option value="auto">Online + Offline</option><option value="online">Online</option><option value="offline">Offline</option></select>
    <button id="listen">Listen</button>
    <div id="output"></div>
  </div>
  <script>
    document.querySelector('#hello').addEventListener('click', async () => {
      const output = document.querySelector('#output');
      if (window.eel) output.textContent = await eel.chatbot_chat('Hello')();
      else output.textContent = 'Thaara is ready.';
    });
    document.querySelector('#listen').addEventListener('click', async () => {
      const output = document.querySelector('#output');
      if (!window.eel || !eel.listenForCommand) { output.textContent = 'Install microphone support first.'; return; }
      output.textContent = 'Listening...';
      const text = await eel.listenForCommand(document.querySelector('#voiceMode').value)();
      output.textContent = text || 'Voice kekkala. Mic permission, quiet room, and SpeechRecognition/PyAudio check pannunga.';
    });
    async function refreshGesture() {
      if (!window.eel || !eel.getGestureState) return;
      const state = await eel.getGestureState()();
      const core = document.querySelector('#core');
      core.className = 'core ' + (state.hand !== 'none' ? state.hand : (state.face ? 'face' : ''));
      document.querySelector('#status').textContent = `Face: ${state.face ? 'detected' : 'not detected'} | Hand: ${state.hand}`;
    }
    setInterval(refreshGesture, 500);
  </script>
</body>
</html>
